version: '3.9'

services:
  db:
    image: mysql:8.0

    container_name: projeto-ads-mysql

    environment:
      MYSQL_DATABASE: ${DB_NAME:-seu_banco_de_dados}
      MYSQL_USER: ${DB_USER:-usuario_db}
      MYSQL_PASSWORD: ${DB_PASSWORD:-senha_segura_123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_seguro_456}

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3307:3306"

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: projeto-ads-api

    command: >
      bash -c "python manage.py migrate &&
               python manage.py runserver 0.0.0.0:8000"

    environment:
      DB_NAME: ${DB_NAME:-seu_banco_de_dados}
      DB_USER: ${DB_USER:-usuario_db}
      DB_PASSWORD: ${DB_PASSWORD:-senha_segura_123}
      DB_HOST: db
      DB_PORT: 3306

      SECRET_KEY: ${SECRET_KEY:-sua-chave-secreta-super-segura-aqui}
      DEBUG: ${DEBUG:-False}

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
